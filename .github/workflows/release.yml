# Builds the Windows installer and publishes it as a GitHub release.
# Run it by pushing a version tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ffmpeg does the recording. It's bundled next to the app (GPL build, so the app is GPL too).
  # This builds a small one with only what the app uses; it's cached until the script changes.
  ffmpeg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache ffmpeg
        id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg.exe
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends mingw-w64 nasm cmake pkg-config
          scripts/build-ffmpeg.sh "$PWD/ffmpeg.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg
          path: ffmpeg.exe

  build:
    needs: ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # No build cache: releases are rare, a cold build takes ~6 minutes, and saving the cache hung for an hour.

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg
          path: ${{ runner.temp }}/ffmpeg

      - name: Test ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item "$env:RUNNER_TEMP/ffmpeg/ffmpeg.exe" src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          scripts/test-ffmpeg.ps1

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        working-directory: src-tauri
        run: cargo tauri build

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
