# Builds the Windows installer and publishes it as a GitHub release.
# Run it by pushing a version tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # No build cache: releases are rare, a cold build takes ~6 minutes, and saving the cache hung for an hour.

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # ffmpeg does the recording. It's bundled next to the app (GPL build, so the app is GPL too).
      - name: Download ffmpeg
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg"
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item $exe.FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Build installer
        working-directory: src-tauri
        run: cargo tauri build

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
