[package]
name = "lol-death-replay"
version = "0.5.0"
description = "Replays your League of Legends deaths in a small floating window"
authors = ["Robin Wibom"]
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
# No default features: "compression" would build brotli to squeeze ~60 KB of UI, and the rest is Linux-only.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
# Windows' own TLS, like ureq below, rather than building rustls.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
rfd = { version = "0.17", default-features = false } # the clips folder picker
ureq = { version = "3", default-features = false, features = ["json", "native-tls-no-default"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same version Tauri uses, so it's only built once.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Game audio capture (WASAPI is COM, which windows-sys doesn't cover). The same version Tauri's
# WebView2 bindings already build, so this only adds features.
windows = { version = "0.62", features = [
    "Win32_Media_Audio",
    "Win32_Security", # CreateEventW
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-core = "0.62" # what #[implement] expands to

# Dependencies without debug info: faster dev builds and links. This crate keeps it.
[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
