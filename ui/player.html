<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Death replay</title>
<style>
  :root {
    --fg: #fff;
    --track: rgba(255, 255, 255, 0.3);
    --hover: rgba(255, 255, 255, 0.14);
    --chip: rgba(242, 242, 245, 0.82);
    --chip-hover: rgba(255, 255, 255, 0.95);
    --chip-fg: #1c1c1e;
    --menu: rgba(30, 30, 32, 0.92);
    --gold: #f5c542;
    --gold-dim: rgba(245, 197, 66, 0.45);
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-move: cubic-bezier(0.77, 0, 0.175, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    color: var(--fg);
    font: 500 13px/1 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  button:focus { outline: none; }
  svg { display: block; }

  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  /* Drag the window from anywhere on the video; a plain click toggles play. */
  #surface { position: absolute; inset: 0; }

  /* Overlay: hidden until the mouse is over the window. */
  .shade, .ui { opacity: 0; transition: opacity 0.2s ease; }
  body.show .shade, body.show .ui { opacity: 1; }
  .shade { position: absolute; left: 0; right: 0; pointer-events: none; }
  .shade.top { top: 0; height: 64px; background: linear-gradient(rgba(0, 0, 0, 0.5), transparent); }
  .shade.bottom { bottom: 0; height: 104px; background: linear-gradient(transparent, rgba(0, 0, 0, 0.72)); }
  .ctl { pointer-events: none; }
  body.show .ctl { pointer-events: auto; }

  #title {
    position: absolute;
    top: 12px; /* 2px higher to make up for the taller line, so the text stays where it was */
    left: 14px;
    max-width: calc(100% - 72px);
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4; /* the body's line-height of 1 makes overflow: hidden cut off g, y and p */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    pointer-events: none;
  }
  #close {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--chip);
    color: var(--chip-fg);
    backdrop-filter: blur(12px);
    transition: background 0.15s ease, transform 0.15s var(--ease);
  }
  #close:hover { background: var(--chip-hover); }
  #close:active { transform: scale(0.94); }

  /* Slider (the timeline). */
  .slider { position: relative; height: 18px; cursor: pointer; touch-action: none; }
  .slider .track {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 4px;
    transform: translateY(-50%);
    border-radius: 2px;
    background: var(--track);
    transition: height 0.15s var(--ease);
  }
  .slider .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: var(--p, 0%);
    border-radius: inherit;
    background: var(--fg);
  }
  .slider .thumb {
    position: absolute;
    top: 50%;
    left: var(--p, 0%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--fg);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
    transform: translate(-50%, -50%);
    transition: width 0.15s var(--ease), height 0.15s var(--ease), background 0.2s ease;
  }
  .slider:hover .track, .slider.active .track { height: 6px; }
  .slider:hover .thumb, .slider.active .thumb { width: 14px; height: 14px; }

  #timeline { position: absolute; left: 14px; right: 14px; bottom: 48px; }
  /* The death zone: a gold "chapter" from a few seconds before the death to the clip's end.
     --zs is where it starts, --zp how far playback is through it. */
  #zone, #zone-label { display: none; }
  body.has-zone #zone, body.has-zone #zone-label { display: block; }
  body.has-zone #timeline .track {
    --gap: linear-gradient(90deg, #000 calc(var(--zs) - 2px), transparent calc(var(--zs) - 2px),
                                  transparent calc(var(--zs) + 2px), #000 calc(var(--zs) + 2px));
    -webkit-mask-image: var(--gap);
    mask-image: var(--gap);
  }
  #zone {
    position: absolute;
    top: 0;
    bottom: 0;
    left: var(--zs);
    right: 0;
    overflow: hidden;
    border-radius: inherit;
    background: var(--gold-dim);
  }
  #zone .zfill { height: 100%; width: var(--zp, 0%); background: var(--gold); }
  #zone-label {
    position: absolute;
    left: var(--zs);
    bottom: 100%;
    padding-left: 3px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--gold);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
    pointer-events: none;
  }
  body.inzone #timeline .thumb { background: var(--gold); }

  .row {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 8px;
    height: 36px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    pointer-events: none;
  }
  .group { display: flex; align-items: center; gap: 2px; }
  .group.right { justify-content: flex-end; }
  #time {
    padding-left: 6px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    white-space: nowrap;
  }
  .icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    transition: background 0.15s ease, transform 0.15s var(--ease);
  }
  .icon:hover { background: var(--hover); }
  .icon:active { transform: scale(0.92); }
  .icon.big { width: 38px; height: 38px; }
  .icon svg { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5)); }

  #play .pause { display: block; }
  #play .resume { display: none; }
  body.paused #play .pause { display: none; }
  body.paused #play .resume { display: block; }
  /* Sound: the speaker mutes; hovering it slides out the volume. */
  .sound { display: flex; align-items: center; }
  #volume {
    width: 0;
    margin: 0;
    opacity: 0;
    transition: width 0.2s var(--ease), margin 0.2s var(--ease), opacity 0.15s ease;
  }
  .sound:hover #volume, #volume.active { width: 64px; margin: 0 8px 0 4px; opacity: 1; }
  #mute .off { display: none; }
  body.muted #mute .on { display: none; }
  body.muted #mute .off { display: block; }
  /* A clip without sound: the speaker shows "off", dimmed, and does nothing. Any dimmer and it
     gets lost over a busy game frame. */
  body.nosound #mute { opacity: 0.55; cursor: default; }
  body.nosound #mute:hover { background: none; }
  body.nosound #mute:active { transform: none; }
  body.nosound #mute .on { display: none; }
  body.nosound #mute .off { display: block; }
  body.nosound #volume { display: none; }
  .speed { position: relative; }
  #speed-label { display: none; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #speed.changed svg { display: none; }
  #speed.changed #speed-label { display: block; }
  #speed-menu {
    position: absolute;
    right: 0;
    bottom: 40px;
    min-width: 84px;
    max-height: calc(100vh - 56px);
    overflow-y: auto;
    padding: 4px;
    border-radius: 10px;
    background: var(--menu);
    backdrop-filter: blur(16px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    transform-origin: bottom right;
    animation: pop 0.16s var(--ease);
  }
  #speed-menu[hidden] { display: none; }
  #speed-menu button {
    width: 100%;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    justify-items: start;
    font-variant-numeric: tabular-nums;
  }
  #speed-menu button:hover { background: var(--hover); }
  #speed-menu button[aria-checked="true"] { font-weight: 700; background: rgba(255, 255, 255, 0.1); }
  @keyframes pop { from { opacity: 0; transform: scale(0.95); } }

  /* Keys and clicks saved with the clip (src-tauri/src/inputs.rs), drawn over the video: the
     last few keys in the top left (the "shutter"), and a ripple where each click was. */
  #inputs { position: absolute; inset: 0; pointer-events: none; display: none; }
  body.has-inputs #inputs { display: block; }
  body.inputs-off #inputs { display: none; }
  #ripples { position: absolute; }
  /* Placed and sized from the picture by drawKeys(): --k is a key's height. */
  #shutter { position: absolute; --k: 24px; transition: transform 0.2s var(--ease); }
  /* Out of the title's way while the controls show. */
  body.show #shutter { transform: translateY(24px); }
  .key {
    --x: 0px;
    --y: 0px;
    position: absolute;
    left: 0;
    top: 0;
    height: var(--k);
    padding: 0 calc(var(--k) * 0.32);
    border-radius: calc(var(--k) * 0.23);
    display: flex;
    align-items: center;
    font-size: calc(var(--k) * 0.5);
    font-weight: 700;
    white-space: nowrap;
    color: rgba(255, 255, 255, 0.92);
    background: rgba(18, 18, 20, 0.72);
    transform: translate(var(--x), var(--y));
    /* Moving between slots is movement on screen: ease-in-out. Transitions, not keyframes, so a
       quick run of presses retargets the slide instead of restarting it. */
    transition: transform 0.2s var(--ease-move), opacity 0.25s ease, background-color 0.15s ease, color 0.15s ease;
  }
  /* Comes in from the left, growing from 92% out of a fade (never from nothing). */
  @starting-style {
    .key { opacity: 0; transform: translate(calc(var(--x) - var(--k) * 0.36), var(--y)) scale(0.92); }
  }
  /* Gold while held, on the instant it goes down (no transition: it marks the moment), back to
     plain glass when let go. */
  .key.on { background: var(--gold); color: #1c1c1e; transition: transform 0.2s var(--ease-move), opacity 0.25s ease; }
  .key .mod { font-weight: 600; opacity: 0.65; font-size: 0.8em; margin-right: 0.25em; }
  .key .n { font-weight: 600; opacity: 0.6; font-size: 0.8em; margin-left: 0.25em; display: inline-block; }
  /* The last two slots step back, so the eye stays near the corner. */
  .key.dim1 { opacity: 0.65; }
  .key.dim2 { opacity: 0.35; }
  /* Held keys pushed out of the row wait in a column at its end, marked off by a faint line that
     rides on each of them (so it comes and goes with them). */
  .key.pinned::before {
    content: '';
    position: absolute;
    left: calc(var(--k) * -0.32);
    top: calc(var(--k) * -0.09);
    bottom: calc(var(--k) * -0.09);
    width: 1px;
    background: rgba(255, 255, 255, 0.28);
  }
  /* Leaving mirrors coming in: it carries on the way it was going, shrinks a little and blurs as
     it fades, so it reads as one soft dissolve. Movement and blur start at once and settle (strong
     ease-out); opacity has a soft tail. Pushed out by a new press is quicker than timing out. */
  .key.pushed {
    opacity: 0;
    transform: translate(var(--x), var(--y)) scale(0.9);
    filter: blur(4px);
    transition: transform 0.26s var(--ease), opacity 0.22s ease, filter 0.22s var(--ease);
  }
  .key.expired {
    opacity: 0;
    transform: translate(calc(var(--x) + var(--k) * 0.32), var(--y)) scale(0.94);
    filter: blur(3px);
    transition: transform 0.34s var(--ease), opacity 0.3s ease, filter 0.3s var(--ease);
  }
  @media (prefers-reduced-motion: reduce) {
    .key, .key.pushed, .key.expired { transition-property: opacity, background-color, color; transform: translate(var(--x), var(--y)); filter: none; }
    @starting-style { .key { transform: translate(var(--x), var(--y)); } }
  }
  #inputs-btn { display: none; }
  body.has-inputs #inputs-btn { display: grid; }
  #inputs-btn .off { display: none; }
  body.inputs-off #inputs-btn .on { display: none; }
  body.inputs-off #inputs-btn .off { display: block; }

  /* Resize from any edge or corner; the window keeps the video's shape. */
  .edge { position: absolute; z-index: 10; touch-action: none; }
  .edge.n, .edge.s { left: 10px; right: 10px; height: 5px; cursor: ns-resize; }
  .edge.e, .edge.w { top: 10px; bottom: 10px; width: 5px; cursor: ew-resize; }
  .edge.n { top: 0; } .edge.s { bottom: 0; } .edge.e { right: 0; } .edge.w { left: 0; }
  .edge.nw, .edge.ne, .edge.sw, .edge.se { width: 10px; height: 10px; }
  .edge.nw { top: 0; left: 0; cursor: nwse-resize; }
  .edge.se { bottom: 0; right: 0; cursor: nwse-resize; }
  .edge.ne { top: 0; right: 0; cursor: nesw-resize; }
  .edge.sw { bottom: 0; left: 0; cursor: nesw-resize; }

  @media (max-width: 300px) { #time { display: none; } }
</style>
</head>
<body class="paused">
  <video id="video" preload="auto"></video>
  <div id="surface"></div>
  <div id="inputs"><canvas id="ripples"></canvas><div id="shutter"></div></div>

  <div class="shade top"></div>
  <div class="shade bottom"></div>

  <div id="title" class="ui"></div>
  <button id="close" class="ui ctl" title="Close" aria-label="Close">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>
  </button>

  <div id="timeline" class="slider ui ctl" title="Drag to scrub">
    <div class="track"><div class="fill"></div><div id="zone"><div class="zfill"></div></div></div>
    <div id="zone-label">DEATH</div>
    <div class="thumb"></div>
  </div>

  <div class="row ui">
    <div class="group"><span id="time">0:00 / 0:00</span></div>

    <div class="group">
      <button id="back" class="icon ctl" title="Back 5 seconds" aria-label="Back 5 seconds">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M6.5 2.8v4h4"/>
          <text x="12" y="15.6" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor" stroke="none" font-family="Segoe UI, sans-serif">5</text>
        </svg>
      </button>
      <button id="play" class="icon big ctl" title="Play / pause" aria-label="Play or pause">
        <svg class="pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></svg>
        <svg class="resume" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 4.9v14.2a1 1 0 0 0 1.5.86l11.6-7.1a1 1 0 0 0 0-1.72L9 4.04a1 1 0 0 0-1.5.86z"/></svg>
      </button>
      <button id="fwd" class="icon ctl" title="Forward 5 seconds" aria-label="Forward 5 seconds">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M17.5 2.8v4h-4"/>
          <text x="12" y="15.6" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor" stroke="none" font-family="Segoe UI, sans-serif">5</text>
        </svg>
      </button>
    </div>

    <div class="group right">
      <button id="inputs-btn" class="icon ctl" title="Keys and clicks on / off" aria-label="Keys and clicks on or off">
        <svg class="on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8"/></svg>
        <svg class="off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h10a2.5 2.5 0 0 1 2.5 2.5v7c0 .8-.4 1.6-1 2M17 18H5a2.5 2.5 0 0 1-2.5-2.5v-7A2.5 2.5 0 0 1 5 6"/><path d="M3 3l18 18"/></svg>
      </button>
      <div class="sound">
        <div id="volume" class="slider ctl" title="Volume">
          <div class="track"><div class="fill"></div></div>
          <div class="thumb"></div>
        </div>
        <button id="mute" class="icon ctl" title="Sound on / off" aria-label="Sound on or off">
          <svg class="on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          <svg class="off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        </button>
      </div>
      <div class="speed">
        <button id="speed" class="icon ctl" title="Playback speed" aria-label="Playback speed" aria-haspopup="menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 18.5a9 9 0 1 1 14.8 0"/><path d="M12 14l4.2-4.2"/><circle cx="12" cy="14" r="1.2" fill="currentColor"/></svg>
          <span id="speed-label"></span>
        </button>
        <div id="speed-menu" class="ctl" role="menu" hidden></div>
      </div>
    </div>
  </div>

  <div class="edge n" data-dir="n"></div><div class="edge s" data-dir="s"></div>
  <div class="edge e" data-dir="e"></div><div class="edge w" data-dir="w"></div>
  <div class="edge nw" data-dir="nw"></div><div class="edge ne" data-dir="ne"></div>
  <div class="edge sw" data-dir="sw"></div><div class="edge se" data-dir="se"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const video = $('video');
  const body = document.body;
  const params = new URLSearchParams(location.search);
  const SPEEDS = [0.25, 0.5, 0.75, 1, 1.5, 2];
  const SKIP = 5;
  // The death's exact frame isn't known, so the zone starts this many seconds before it.
  const ZONE_LEAD = 3;
  // Playback starts this many seconds before the death; the rest of the clip is a scrub away.
  const START_LEAD = 5;
  let aspect = 16 / 9;
  let zoneStart = 1;  // fraction of the clip where the death zone starts; 1 = no zone

  // Rust side: src-tauri/src/player.rs
  const { invoke: call, convertFileSrc } = window.__TAURI__.core;
  const close = () => call('player_close');
  video.src = convertFileSrc(params.get('clip'));
  const uiLog = (msg) => call('ui_log', { msg: `Replay window: ${msg}` });
  video.addEventListener('error', () => uiLog(`can't play ${params.get('clip')} (${video.error?.message || video.error?.code})`));
  video.addEventListener('loadedmetadata', () => uiLog(`playing ${video.videoWidth}x${video.videoHeight}, ${video.duration.toFixed(1)}s`), { once: true });
  window.addEventListener('error', (e) => uiLog(e.message));

  const title = params.get('title') || 'Death replay';
  document.title = title;
  $('title').textContent = title;

  const fmt = (t) => {
    t = Math.max(0, Math.floor(t || 0));
    return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  };
  const setFrac = (el, f) => el.style.setProperty('--p', `${clamp(f, 0, 1) * 100}%`);

  // ---- playback ----
  const togglePlay = () => {
    if (!video.paused) return video.pause();
    if (video.ended) video.currentTime = 0; // after the end, play starts over from the beginning
    video.play();
  };
  const seek = (t) => {
    if (video.duration) video.currentTime = clamp(t, 0, video.duration - 0.01);
  };

  // Plays once from START_LEAD before the death and stops on the last frame; pressing play again
  // starts over from the clip's beginning (togglePlay).
  // Always starts at 1×; the speed menu changes it while watching.
  // With sound at the volume last chosen. If the WebView won't start sound without a click, it
  // starts muted instead, and the speaker button turns the sound on.
  const sound = JSON.parse(localStorage.getItem('sound') || '{}');
  video.volume = clamp(sound.volume ?? 1, 0, 1);
  video.muted = !!sound.muted;
  video.play().catch(() => { video.muted = true; video.play(); });

  video.addEventListener('play', () => body.classList.remove('paused'));
  video.addEventListener('pause', () => body.classList.add('paused'));
  video.addEventListener('loadedmetadata', () => {
    if (video.videoWidth && video.videoHeight) {
      aspect = video.videoWidth / video.videoHeight;
      if (Math.abs(aspect - 16 / 9) > 0.01) call('player_fit', { aspect });
    }
    const deathFromEnd = parseFloat(params.get('death')) || 0;
    if (deathFromEnd > 0 && video.duration > deathFromEnd) {
      zoneStart = Math.max(0, 1 - (deathFromEnd + ZONE_LEAD) / video.duration);
      $('timeline').style.setProperty('--zs', `${zoneStart * 100}%`);
      body.classList.add('has-zone');
      seek(video.duration - deathFromEnd - START_LEAD);
    }
  });

  // ---- keys and clicks ----
  // Saved beside the clip when "Record keys and clicks" is on; the format is described in
  // src-tauri/src/inputs.rs. Everything is drawn from video.currentTime, so it follows seeking,
  // pausing and slow motion by itself.
  //
  // Keys go in the "shutter", top left: the last MAX_KEYS presses in a row, newest in the corner.
  // A new press comes in at the corner and pushes the rest along; the one past the end is pushed
  // out, and keys fade on their own FADE seconds after they're let go. A key still held when it's
  // pushed out (camera lock on Space, the scoreboard on Tab, a channel) isn't dropped: it jumps to
  // a column at the end of the row and stays there, gold, until it's let go.
  // Mouse 3 and up are usually bound to something (camera, a summoner), so they're keys here;
  // left and right clicks are the ripples.
  const MAX_KEYS = 5;   // keys in the row
  const HELD_MAX = 3;   // keys in the held column
  const FADE = 2.5;     // a key leaves this long (video seconds) after it's let go
  const AGAIN = 0.6;    // the same key again within this long counts up (A ×3) instead of taking a slot
  const TAP = 0.1;      // a key stays lit at least this long (video seconds), so a quick tap shows
  const RIPPLE = 0.45;  // how long a click's ripple lasts (video seconds)
  const MODS = ['Shift', 'Ctrl', 'Alt'];
  const MOUSE_KEYS = { middle: 'M3', mouse4: 'M4', mouse5: 'M5' };
  const CLICK_COLORS = { left: '245, 197, 66', right: '76, 194, 127' };
  let inputs = null;    // { strokes, clicks, els: Map(stroke id -> element), last: time last drawn }
  const ripples = $('ripples');
  const ink = ripples.getContext('2d');

  // Strokes: what the shutter shows, one per press, in order.
  // - From [from, to) spans of each key held (and of chat being open, shown as a held "Chat").
  // - Shift, Ctrl and Alt fold into the key pressed while they were held (⇧E), and only show on
  //   their own if nothing was pressed under them.
  // - The same thing pressed again within AGAIN seconds adds a press to the last stroke (A ×3),
  //   so attack-move spam doesn't push everything else out.
  function readInputs(events) {
    const spans = [], downAt = new Map(), clicks = [];
    let chatFrom = null;
    const add = (k, from, to) => spans.push({ k, from, to: Math.max(to, from + TAP) });
    for (const e of events) {
      if ('key' in e) {
        if (e.down && !downAt.has(e.key)) downAt.set(e.key, e.t);
        else if (!e.down && downAt.has(e.key)) { add(e.key, downAt.get(e.key), e.t); downAt.delete(e.key); }
      } else if ('button' in e) {
        if (MOUSE_KEYS[e.button]) add(MOUSE_KEYS[e.button], e.t, e.t);
        else clicks.push(e);
      } else if ('chat' in e) {
        if (e.chat && chatFrom === null) chatFrom = e.t;
        else if (!e.chat && chatFrom !== null) { add('Chat', chatFrom, e.t); chatFrom = null; }
      }
    }
    for (const [k, from] of downAt) add(k, from, Infinity); // still held when the clip ends
    if (chatFrom !== null) add('Chat', chatFrom, Infinity);
    spans.sort((a, b) => a.from - b.from);

    const isMod = (s) => MODS.includes(s.k);
    const strokes = [];
    for (const s of spans) {
      if (isMod(s) && spans.some((o) => !isMod(o) && o.from >= s.from && o.from < s.to)) continue;
      const mods = isMod(s) ? [] : spans.filter((m) => isMod(m) && m.from <= s.from && s.from < m.to).map((m) => m.k);
      const label = [...mods, s.k].join('+');
      const last = strokes[strokes.length - 1];
      if (last && last.label === label && s.from - last.presses[last.presses.length - 1][0] < AGAIN) {
        last.presses.push([s.from, s.to]);
      } else {
        strokes.push({ id: strokes.length, label, mods, k: s.k, presses: [[s.from, s.to]] });
      }
    }
    return { strokes, clicks };
  }

  function showInputs(data) {
    inputs = { ...readInputs(data.events || []), els: new Map(), last: null };
    body.classList.add('has-inputs');
  }

  call('player_inputs', { clip: params.get('clip') })
    .then((text) => text && showInputs(JSON.parse(text)))
    .catch((e) => uiLog(`can't read the clip's keys and clicks (${e})`));

  // Where the picture is inside the video element (letterboxed if the shapes differ).
  function picture() {
    const W = video.clientWidth, H = video.clientHeight;
    const vw = video.videoWidth || W, vh = video.videoHeight || H;
    const s = Math.min(W / vw, H / vh);
    return { x: (W - vw * s) / 2, y: (H - vh * s) / 2, w: vw * s, h: vh * s };
  }

  // ---- the shutter ----
  // Worked out from the time alone: which strokes show is a function of t, and CSS transitions
  // animate the difference from the last frame. So it follows seeking, pausing and slow motion.
  const shutter = $('shutter');
  const pressedBy = (s, t) => s.presses.filter(([from]) => from <= t);
  const isHeld = (s, t) => s.presses.some(([from, to]) => t >= from && t < to);
  // When it was last let go, so far (a key still held stays on screen).
  const letGoAt = (s, t) => Math.max(...pressedBy(s, t).map(([, to]) => Math.min(to, video.duration || to)));

  function keyEl(s) {
    const e = document.createElement('div');
    e.className = 'key';
    for (const m of s.mods) {
      const mod = document.createElement('span');
      mod.className = 'mod';
      mod.textContent = m === 'Shift' ? '⇧' : m;
      e.append(mod);
    }
    e.append(s.k);
    e.n = document.createElement('span');
    e.n.className = 'n';
    e.append(e.n);
    return e;
  }

  function updateKey(e, s, t) {
    const n = pressedBy(s, t).length;
    const count = n > 1 ? `×${n}` : '';
    if (e.n.textContent !== count) {
      e.n.textContent = count;
      // A small bump from 0.8, not from 0: "again", not an announcement.
      if (n > 1) e.n.animate([{ transform: 'scale(0.8)', opacity: 0.4 }, { transform: 'none' }], { duration: 160, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
    }
    e.classList.toggle('on', isHeld(s, t));
  }

  // Plays the key's exit, then takes it out of the page. Whatever made it leave, it isn't held
  // any more, so it goes plain as it fades.
  function retire(id, e, how) {
    if (e.retired) return;
    e.retired = true;
    e.classList.remove('on');
    e.classList.add(how);
    setTimeout(() => {
      e.remove();
      if (inputs.els.get(id) === e) inputs.els.delete(id);
    }, 450);
  }

  function drawKeys(t, r) {
    // A jump (seeking, or the window coming back from the background) rebuilds the row where it
    // belongs instead of sliding everything across from where it was.
    if (inputs.last === null || t < inputs.last - 0.001 || t - inputs.last > 0.5) {
      shutter.replaceChildren();
      inputs.els.clear();
    }
    inputs.last = t;

    // Sized and placed from the picture: keys scale with it, within reason.
    const k = clamp(r.w * 0.022, 13, 30);
    shutter.style.setProperty('--k', `${k}px`);
    shutter.style.left = `${r.x + Math.max(10, r.w * 0.012)}px`;
    shutter.style.top = `${r.y + Math.max(8, r.h * 0.02)}px`;
    const gap = k * 0.14, rowH = k * 1.18;

    const started = inputs.strokes.filter((s) => s.presses[0][0] <= t);
    const kept = started.slice(-MAX_KEYS);
    const keptIds = new Set(kept.map((s) => s.id));
    const row = kept.filter((s) => t < letGoAt(s, t) + FADE);
    const held = started.filter((s) => !keptIds.has(s.id) && isHeld(s, t)).slice(-HELD_MAX);
    const shown = new Set([...row, ...held].map((s) => s.id));

    for (const [id, e] of inputs.els) {
      if (shown.has(id)) continue;
      if (e.inRow && !keptIds.has(id)) {
        // Pushed out by a newer press: carries on one slot as it fades.
        e.style.setProperty('--x', `${e.x + e.offsetWidth + gap}px`);
        retire(id, e, 'pushed');
      } else {
        retire(id, e, 'expired'); // timed out, or let go in the held column
      }
    }

    const place = (s, x, y) => {
      let e = inputs.els.get(s.id);
      if (e && e.retired) { e.remove(); e = null; }
      if (!e) {
        e = keyEl(s);
        // Set before it's in the page, so it comes in where it belongs.
        e.style.setProperty('--x', `${x}px`);
        e.style.setProperty('--y', `${y}px`);
        shutter.append(e);
        inputs.els.set(s.id, e);
      }
      updateKey(e, s, t);
      e.x = x;
      e.style.setProperty('--x', `${x}px`);
      e.style.setProperty('--y', `${y}px`);
      return e;
    };

    // The row: newest in the corner, older ones pushed to the right.
    let x = 0;
    row.slice().reverse().forEach((s, i) => {
      const e = place(s, x, 0);
      e.inRow = true;
      e.classList.remove('pinned');
      e.classList.toggle('dim1', i === MAX_KEYS - 2);
      e.classList.toggle('dim2', i === MAX_KEYS - 1);
      x += e.offsetWidth + gap;
    });

    // The held column, at a fixed spot past where a full row ends, so a key jumps to a place the
    // eye can learn; only a row wider than that pushes it further right. Keys stack down in the
    // order they joined, so one joining never moves the others.
    const colX = Math.max(k * 1.68 * MAX_KEYS, x + k * 0.55);
    held.forEach((s, i) => {
      const e = place(s, colX, i * rowH);
      e.inRow = false;
      e.classList.remove('dim1', 'dim2');
      e.classList.add('pinned');
    });
  }

  function drawInputs(t) {
    if (!inputs || body.classList.contains('inputs-off')) return;
    const r = picture(), dpr = devicePixelRatio || 1;
    drawKeys(t, r);

    const w = Math.round(r.w * dpr), h = Math.round(r.h * dpr);
    if (ripples.width !== w || ripples.height !== h) {
      Object.assign(ripples.style, { left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px` });
      ripples.width = w;
      ripples.height = h;
    }
    ink.clearRect(0, 0, w, h);
    for (const c of inputs.clicks) {
      const age = t - c.t;
      if (age < 0 || age >= RIPPLE) continue;
      const p = age / RIPPLE, fade = 1 - p * p;
      const x = c.x * w, y = c.y * h, size = h / 200;
      const color = CLICK_COLORS[c.button] || '255, 255, 255';
      // A dark halo keeps it visible over a bright game.
      ink.shadowColor = `rgba(0, 0, 0, ${0.7 * fade})`;
      ink.shadowBlur = 3 * dpr;
      ink.lineWidth = Math.max(1.5 * dpr, size * 0.45);
      ink.strokeStyle = `rgba(${color}, ${fade})`;
      ink.beginPath();
      ink.arc(x, y, size * (1.2 + 3.8 * Math.sqrt(p)), 0, Math.PI * 2);
      ink.stroke();
      ink.fillStyle = `rgba(${color}, ${fade * 0.9})`;
      ink.beginPath();
      ink.arc(x, y, size * 0.6, 0, Math.PI * 2);
      ink.fill();
    }
  }

  // Hidden or shown with its button; remembered for the next replay.
  body.classList.toggle('inputs-off', localStorage.getItem('inputs') === 'off');
  $('inputs-btn').addEventListener('click', () => {
    const off = !body.classList.contains('inputs-off');
    body.classList.toggle('inputs-off', off);
    localStorage.setItem('inputs', off ? 'off' : 'on');
  });

  (function render() {
    const d = video.duration || 0;
    const p = d ? video.currentTime / d : 0;
    setFrac($('timeline'), p);
    if (zoneStart < 1) {
      $('timeline').style.setProperty('--zp', `${clamp((p - zoneStart) / (1 - zoneStart), 0, 1) * 100}%`);
      body.classList.toggle('inzone', p >= zoneStart);
    }
    $('time').textContent = `${fmt(video.currentTime)} / ${fmt(d)}`;
    drawInputs(video.currentTime);
    requestAnimationFrame(render);
  })();

  $('play').addEventListener('click', togglePlay);
  $('back').addEventListener('click', () => seek(video.currentTime - SKIP));
  $('fwd').addEventListener('click', () => seek(video.currentTime + SKIP));
  $('close').addEventListener('click', close);

  // Click (not drag) on the video toggles play.
  // Dragging it moves the window (handed to Windows once the mouse moves a few pixels).
  let downAt = null;
  $('surface').addEventListener('pointerdown', (e) => {
    if (e.button === 0) downAt = [e.screenX, e.screenY];
  });
  $('surface').addEventListener('pointermove', (e) => {
    if (downAt && Math.hypot(e.screenX - downAt[0], e.screenY - downAt[1]) >= 4) {
      downAt = null;
      window.__TAURI__.window.getCurrentWindow().startDragging();
    }
  });
  $('surface').addEventListener('pointerup', () => {
    if (downAt) togglePlay();
    downAt = null;
  });

  // ---- sliders ----
  function slider(el, { start, move, end }) {
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      el.setPointerCapture(e.pointerId);
      el.classList.add('active');
      body.classList.add('holding');
      start?.();
      const update = (ev) => {
        const r = el.getBoundingClientRect();
        move(clamp((ev.clientX - r.left) / r.width, 0, 1));
      };
      const up = (ev) => {
        el.removeEventListener('pointermove', update);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
        el.classList.remove('active');
        body.classList.remove('holding');
        end?.();
        if (ev.clientX < 0 || ev.clientY < 0 || ev.clientX > innerWidth || ev.clientY > innerHeight) hideUi();
      };
      update(e);
      el.addEventListener('pointermove', update);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    });
  }

  let resumeAfterScrub = false;
  slider($('timeline'), {
    start: () => { resumeAfterScrub = !video.paused; video.pause(); },
    move: (f) => seek(f * (video.duration || 0)),
    end: () => { if (resumeAfterScrub) video.play(); },
  });

  // ---- sound ----
  // Remembered for the next replay. Only what you choose is: not the muting autoplay may need.
  const keepSound = () => localStorage.setItem('sound', JSON.stringify({ volume: video.volume, muted: video.muted }));
  function syncSound() {
    const off = video.muted || video.volume === 0;
    body.classList.toggle('muted', off);
    setFrac($('volume'), off ? 0 : video.volume);
  }
  video.addEventListener('volumechange', syncSound);
  syncSound();
  // No sound track in the clip (missing from older links too: treat those as having sound).
  if (params.get('sound') === '0') {
    body.classList.add('nosound');
    $('mute').setAttribute('aria-disabled', 'true');
    $('mute').title = params.get('recordSound') === '0'
      ? 'No sound: Record game sound is off in settings'
      : 'This clip has no sound';
  }
  $('mute').addEventListener('click', () => {
    if (body.classList.contains('nosound')) return;
    if (video.muted || video.volume === 0) {
      video.muted = false;
      if (video.volume === 0) video.volume = 1;
    } else {
      video.muted = true;
    }
    keepSound();
  });
  slider($('volume'), {
    move: (f) => { video.volume = f; video.muted = f === 0; },
    end: keepSound,
  });

  // ---- speed ----
  const menu = $('speed-menu');
  for (const s of SPEEDS) {
    const b = document.createElement('button');
    b.role = 'menuitemradio';
    b.dataset.speed = s;
    b.textContent = s === 1 ? 'Normal' : `${s}×`;
    b.addEventListener('click', () => { setSpeed(s); menu.hidden = true; });
    menu.append(b);
  }
  function setSpeed(s) {
    video.defaultPlaybackRate = s;
    video.playbackRate = s;
  }
  function syncSpeed() {
    const s = video.playbackRate;
    $('speed-label').textContent = `${s}×`;
    $('speed').classList.toggle('changed', s !== 1);
    for (const b of menu.children) b.setAttribute('aria-checked', String(+b.dataset.speed === s));
  }
  video.addEventListener('ratechange', syncSpeed);
  syncSpeed();
  $('speed').addEventListener('click', () => { menu.hidden = !menu.hidden; });
  document.addEventListener('pointerdown', (e) => {
    if (!menu.hidden && !e.target.closest('.speed')) menu.hidden = true;
  });

  // ---- show controls on hover ----
  const hideUi = () => { body.classList.remove('show'); menu.hidden = true; };
  document.addEventListener('mousemove', () => body.classList.add('show'));
  document.documentElement.addEventListener('mouseleave', () => {
    if (!body.classList.contains('holding')) hideUi();
  });

  // ---- resize, keeping the video's aspect ratio ----
  for (const el of document.querySelectorAll('.edge')) {
    const dir = el.dataset.dir;
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      el.setPointerCapture(e.pointerId);
      body.classList.add('holding');
      const sx = e.screenX, sy = e.screenY, w0 = innerWidth, h0 = innerHeight;
      const anchor = (dir.includes('n') ? 'S' : 'N') + (dir.includes('w') ? 'E' : 'W');
      let next = null, busy = false;
      const flush = () => {
        if (busy || !next) return;
        const [w, h] = next;
        next = null;
        busy = true;
        call('player_resize', { width: w, height: h, anchor }).finally(() => { busy = false; flush(); });
      };
      const move = (ev) => {
        const dx = ev.screenX - sx, dy = ev.screenY - sy;
        const fromX = dir.includes('e') ? w0 + dx : dir.includes('w') ? w0 - dx : 0;
        const fromY = dir.includes('s') ? (h0 + dy) * aspect : dir.includes('n') ? (h0 - dy) * aspect : 0;
        // Corners follow whichever direction the mouse moved further.
        const w = Math.round(clamp(Math.max(fromX, fromY), 240, screen.availWidth));
        next = [w, Math.round(w / aspect)];
        flush();
      };
      const up = () => {
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
        body.classList.remove('holding');
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    });
  }

  document.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
</body>
</html>
